name: Build

# Runs the tests and lint, and builds the release APK, on every push to main and on request ("Run workflow" on
# the Actions tab). The APK is signed with the runner's own debug key, which is not the key of any phone's
# install: it can be put on a phone that does not have the app, or after the app was uninstalled, but not over
# a build made on another computer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner has an Android SDK. It is made writable and its licences are accepted, so that the Android Gradle
      # plugin can fetch the platform and build tools that the project asks for and the image does not have.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sudo chown -R "$USER" "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintRelease --stacktrace

      - name: Release APK (signed with the debug key)
        run: ./gradlew assembleRelease -PdebugSignedRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: latent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
