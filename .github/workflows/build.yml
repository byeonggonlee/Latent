name: Build

# Runs the tests and lint, and builds the release APK, on every push to main and on request ("Run workflow" on
# the Actions tab). The APK is signed with the runner's own debug key, which is not the key of any phone's
# install: it can be put on a phone that does not have the app, or after the app was uninstalled, but not over
# a build made on another computer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner has an Android SDK. It is made writable and its licences are accepted, so that the Android Gradle
      # plugin can fetch the platform and build tools that the project asks for and the image does not have.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Gradle and sdkmanager write into the SDK's own folders, which the runner image leaves to root: its licenses, and a
          # platform or build tools it lacks. Only those are handed over; the whole SDK, recursively, took most of a minute.
          sudo chown "$USER" "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo chown -R "$USER" "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6

      # The APK says which commit it was built from, in its name and in the version the About dialog shows.
      - name: Version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          base=$(grep '^latent.versionBase=' gradle.properties | cut -d= -f2)
          name="$base-ci.$(git rev-parse --short=7 HEAD)"
          echo "code=$count" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=latent-$name-$count-arm64-v8a.apk" >> "$GITHUB_OUTPUT"

      # The tests that only a phone can run (GPU tone, subject masks, ...) are compiled here, so that one that no longer
      # builds is found before the phone is.
      - name: Tests and lint
        env:
          # A test writes the GPU shaders here for the next step.
          SHADER_EXPORT_DIR: ${{ runner.temp }}/shaders
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebugAndroidTest --stacktrace

      # Lint's findings in the log, warnings too, where a failing run otherwise only has them in the reports artifact.
      - name: Lint findings
        if: always()
        run: |
          for report in app/build/reports/lint-results-*.txt; do
            [ -f "$report" ] || continue
            echo "::group::$(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done

      # A phone's driver compiles the shaders and, if one is wrong, the processor does the work without a word: this
      # finds a mistake of syntax or type before a phone does.
      - name: Shaders compile
        run: |
          sudo apt-get install -y --no-install-recommends glslang-tools > /dev/null
          ls "$RUNNER_TEMP"/shaders/*.comp > /dev/null
          for shader in "$RUNNER_TEMP"/shaders/*.comp; do
            echo "== $(basename "$shader")"
            glslangValidator "$shader"
          done

      # Room rewrites the schema file of the current version at every build; a difference from the committed one means
      # an entity changed without a new version and its migration.
      - name: Room schema is committed
        run: git diff --exit-code -- app/schemas

      # What PRIVACY.md promises: no tracking or Google services libraries, and only the permissions it lists.
      - name: Privacy
        run: |
          ./gradlew -q :app:processReleaseManifest
          scripts/check-privacy.sh

      - name: Release APK (signed with the debug key)
        run: |
          ./gradlew assembleRelease -PdebugSignedRelease -PlatentVersionCode=${{ steps.version.outputs.code }} -PlatentVersionName=${{ steps.version.outputs.name }} -PlatentAbis=arm64-v8a --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: latent-release-apk
          path: latent-*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
