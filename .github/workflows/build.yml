name: Build

# Runs the tests and lint, and builds the release APK, on every push to main and on request ("Run workflow" on
# the Actions tab). The APK is signed with the runner's own debug key, which is not the key of any phone's
# install: it can be put on a phone that does not have the app, or after the app was uninstalled, but not over
# a build made on another computer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the command line tools into a folder that can be written to, and accepts the licences, so that the
      # Android Gradle plugin can fetch the platform and build tools the project asks for.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintRelease --stacktrace

      - name: Release APK (signed with the debug key)
        run: ./gradlew assembleRelease -PdebugSignedRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: latent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
