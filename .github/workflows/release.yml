name: Release

# A stable build: a tag `vX.Y.Z` (or `vX.Y.Z-rc.1`, published as a pre-release) that the owner puts on a commit of
# `main` builds the signed APK and publishes it as a release, for good. The policy is in docs/RELEASES.md.
# Unlike a nightly, it refuses to run without the signing secrets: a release that no phone could update to is a mistake.
# The build, with its tests, Gradle plugins and the signing secrets, may only read the repository; the release is made
# by a job of its own, which may write to it but runs nothing of the build's and never sees the secrets.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      name: ${{ steps.tag.outputs.name }}
      pre: ${{ steps.tag.outputs.pre }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          name="${GITHUB_REF_NAME#v}"
          base=$(grep '^latent.versionBase=' gradle.properties | cut -d= -f2)
          if ! echo "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::The tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-suffix."; exit 1
          fi
          if [ "${name%%-*}" != "$base" ]; then
            echo "::error::The tag says $name, but latent.versionBase in gradle.properties is $base. Change the one that is wrong and tag again."; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."; exit 1
          fi
          for secret in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::The signing secret for $secret is not set (see docs/RELEASES.md, Signing): all four are needed."; exit 1
            fi
          done
          # The nightly's debug key is of no value to anyone; a stable release is signed with a key kept for it.
          if [ "$KEY_ALIAS" = "androiddebugkey" ]; then
            echo "::error::The signing key is the debug key (alias androiddebugkey). Make a release key first (docs/RELEASES.md, Signing)."; exit 1
          fi
          # A section still marked unreleased is notes that have not been written up for this release.
          if ! echo "$name" | grep -q -- '-' && grep -Ei "^## \\[?${name%%-*}\\]?.*unreleased" CHANGELOG.md > /dev/null; then
            echo "::error::CHANGELOG.md has the section of $name marked unreleased: write the date in, as docs/RELEASES.md says, and tag again."; exit 1
          fi
          count=$(git rev-list --count HEAD)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$count" >> "$GITHUB_OUTPUT"
          echo "file=latent-$name-$count.apk" >> "$GITHUB_OUTPUT"
          case "$name" in *-*) echo "pre=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "pre=" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          # Gradle and sdkmanager write into the SDK's own folders, which the runner image leaves to root: its licenses, and a
          # platform or build tools it lacks. Only those are handed over; the whole SDK, recursively, took most of a minute.
          sudo chown "$USER" "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo chown -R "$USER" "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintRelease --stacktrace

      # Lint's findings in the log, warnings too, where a failing run otherwise only has them in the reports artifact.
      - name: Lint findings
        if: always()
        run: |
          for report in app/build/reports/lint-results-*.txt; do
            [ -f "$report" ] || continue
            echo "::group::$(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done

      - name: Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew assembleRelease -PlatentVersionCode=${{ steps.tag.outputs.code }} -PlatentVersionName=${{ steps.tag.outputs.name }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.tag.outputs.file }}"
          sha256sum "${{ steps.tag.outputs.file }}" > "${{ steps.tag.outputs.file }}.sha256"

      # The notes are the version's section of CHANGELOG.md; without one, the commits since the release before it.
      - name: Notes
        run: |
          name="${{ steps.tag.outputs.name }}"
          core="${name%%-*}"
          awk -v v="$core" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ") || $0 ~ ("^## " v "$")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md 2>/dev/null > notes.md || true
          if [ ! -s notes.md ]; then
            prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
            if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
            { echo "Changes:"; echo; git log --pretty='- %s' "$range" | head -200; } > notes.md
          fi
          {
            echo
            echo "---"
            echo "Version $name (code ${{ steps.tag.outputs.code }}), commit \`$(git rev-parse --short HEAD)\`. Check a download with \`shasum -a 256 -c ${{ steps.tag.outputs.file }}.sha256\`."
          } >> notes.md

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

      # What the publish job puts out, and nothing else of the workspace: not keystore.properties.
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ steps.tag.outputs.file }}
            ${{ steps.tag.outputs.file }}.sha256
            notes.md
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A download whose digest differs from the upload's fails.
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Publish
        env:
          NAME: ${{ needs.build.outputs.name }}
          PRE: ${{ needs.build.outputs.pre }}
        run: |
          # The APK's name is found in what was downloaded, not passed from the build job as an output: the name holds
          # "latent", which a secret (the key alias) also holds, and Actions drops a job output that holds a secret.
          shopt -s nullglob
          apks=(latent-*.apk)
          if [ "${#apks[@]}" != 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "::error::Expected one latent-*.apk in the artifact, found ${#apks[@]}."; exit 1
          fi
          FILE="${apks[0]}"
          # The APK the build signed, as it left it.
          sha256sum -c "$FILE.sha256"
          gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" $PRE --verify-tag \
            --title "Latent $NAME" \
            --notes-file notes.md
