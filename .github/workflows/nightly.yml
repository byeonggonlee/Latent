name: Nightly

# A build of the day for the phones, published as a pre-release that can be installed over the one before it. It is
# made when `main` has commits that the last nightly does not, at 03:00 in Korea or when asked for; the policy
# is in docs/RELEASES.md. Without the signing secrets it only builds, and keeps the APK as an artifact: an APK that
# is signed with a key no phone knows would not update anything.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing has changed since the last nightly"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.what.outputs.skip }}
      last: ${{ steps.what.outputs.last }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: what
        run: |
          last=$(git tag --list 'nightly-*' --sort=-creatordate | head -1)
          if [ -n "$last" ]; then changed=$(git rev-list --count "$last"..HEAD); else changed=1; fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$changed" = 0 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing new since $last."
          fi

  nightly:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNED: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          # Gradle and sdkmanager write into the SDK's own folders, which the runner image leaves to root: its licenses, and a
          # platform or build tools it lacks. Only those are handed over; the whole SDK, recursively, took most of a minute.
          sudo chown "$USER" "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          sudo mkdir -p "$ANDROID_HOME/licenses"
          sudo chown -R "$USER" "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          day=$(TZ=Asia/Seoul date +%Y%m%d)
          base=$(grep '^latent.versionBase=' gradle.properties | cut -d= -f2)
          echo "code=$count" >> "$GITHUB_OUTPUT"
          echo "name=$base-nightly.$day" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$day-$count" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "file=latent-$base-nightly.$day-$count-arm64-v8a.apk" >> "$GITHUB_OUTPUT"

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug lintRelease --stacktrace

      # Lint's findings in the log, warnings too, where a failing run otherwise only has them in the reports artifact.
      - name: Lint findings
        if: always()
        run: |
          for report in app/build/reports/lint-results-*.txt; do
            [ -f "$report" ] || continue
            echo "::group::$(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done

      - name: Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          versions="-PlatentVersionCode=${{ steps.version.outputs.code }} -PlatentVersionName=${{ steps.version.outputs.name }} -PlatentAbis=arm64-v8a"
          if [ "$SIGNED" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            ./gradlew assembleRelease $versions --stacktrace
          else
            echo "::warning::No signing key in the repository secrets: the APK is built and kept as an artifact, not published."
            ./gradlew assembleRelease -PdebugSignedRelease $versions --stacktrace
          fi
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.file }}"
          sha256sum "${{ steps.version.outputs.file }}" > "${{ steps.version.outputs.file }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: latent-nightly-apk
          path: |
            latent-*.apk
            latent-*.apk.sha256
          retention-days: 14

      - name: Publish
        if: env.SIGNED == 'true'
        env:
          LAST: ${{ needs.changes.outputs.last }}
        run: |
          if [ -n "$LAST" ]; then range="$LAST..HEAD"; else range="HEAD~30..HEAD"; fi
          {
            echo "Nightly build ${{ steps.version.outputs.day }} of the \`main\` branch at commit \`$(git rev-parse --short HEAD)\`, version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})."
            echo
            echo "Installs over the nightly before it, which was signed with the same key. A build only goes forward: an older one cannot be put back over a newer one without uninstalling the app, which takes its database along."
            echo
            echo "Changes since the last nightly:"
            git log --pretty='- %s' $range | head -80
          } > notes.md
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.file }}" "${{ steps.version.outputs.file }}.sha256" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ${{ steps.version.outputs.day }} (build ${{ steps.version.outputs.code }})" \
            --notes-file notes.md

      - name: Keep the last seven
        if: env.SIGNED == 'true'
        run: |
          gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("nightly-"))] | .[7:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
