name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
  - type: input
    id: version
    attributes:
      label: Version
      description: Library menu → About Latent
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Galaxy S24 Ultra, Android 17
  - type: input
    id: camera
    attributes:
      label: Camera, if it has to do with a sync or a raw file
      placeholder: Sony ZV-E10, ARW
